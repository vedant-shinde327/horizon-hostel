<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hostel Horizon</title>
    <link rel="stylesheet" href="../css/login.css">
     <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
      <section class="login-section">

        <!-- BACKGROUND GLOW -->

        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>

        <div class="login-container">

            <!-- LEFT CONTENT -->

            <div class="login-left">

                <h1>

                    Welcome Back

                </h1>

                <p>

                    Access your hostel dashboard,
                    notices, mess updates, room details,
                    and student services.

                </p>

                <div class="login-features">

                    <div class="feature-item">

                        <i class="fa-solid fa-shield-halved"></i>

                        <span>

                            Secure Authentication

                        </span>

                    </div>

                    <div class="feature-item">

                        <i class="fa-solid fa-building"></i>

                        <span>

                            Smart Hostel Management

                        </span>

                    </div>

                    <div class="feature-item">

                        <i class="fa-solid fa-bell"></i>

                        <span>

                            Real-Time Notices

                        </span>

                    </div>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="login-right">

                <form 
                action="http://localhost:3000/login"
                method="POST"
                class="login-form"
                >

                    <h2>

                        Student Login

                    </h2>

                    <!-- EMAIL -->

                    <div class="input-box">

                        <label for="email">

                            Email Address

                        </label>

                        <div class="input-field">

                            <i class="fa-solid fa-envelope"></i>

                            <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            >

                        </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-box">

                        <label for="password">

                            Password

                        </label>

                        <div class="input-field">

                            <i class="fa-solid fa-lock"></i>

                            <input 
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            minlength="6"
                            required
                            >

                        </div>

                    </div>

                    <!-- LOGIN BUTTON -->

                    <button 
                    type="submit"
                    class="login-btn"
                    >

                        Login

                    </button>

                    <!-- REGISTER LINK -->

                    <p class="register-link">

                        Don't have an account?

                        <a href="./register.html">

                            Register

                        </a>

                    </p>

                </form>

            </div>

        </div>

    </section>
</body>
</html>
